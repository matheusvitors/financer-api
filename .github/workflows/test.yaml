name: Tests
on:
    push:
        branches:
            - main
            - dev
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
        NODE_ENV: tests
        PORT: 7005
        DATABASE_URL: "mysql://test:test@localhost:0000/test"
        AUTHENTICATION: true
        SECRET: testsecret
        JWT_EXPIRE: 15m
        NEW_USERS: true
    steps:
        - name: Checkout Repository
          uses: actions/checkout@v2
        - name: Setup Node
          uses: actions/setup-node@v4
        - name: Install Dependences
          run: |
            if [ -e pnpm-lock.yaml ]; then
            pnpm install
            elif [ -e package-lock.json ]; then
            npm ci
            else
            npm i
            fi
        - name: Run Tests
          run: npm run test:ci
